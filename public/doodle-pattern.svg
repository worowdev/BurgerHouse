      <circle cx="300" cy="35" r="2.5"/>
      <circle cx="18" cy="100" r="2.5"/>
      <circle cx="250" cy="155" r="3"/>
      <circle cx="400" cy="250" r="2.5"/>
      <circle cx="120" cy="300" r="2.5"/>
      <circle cx="300" cy="322" r="3"/>
      <circle cx="20" cy="398" r="2.5"/>
