    <use href="#drumstick" xlink:href="#drumstick" transform="translate(205 58) rotate(28)"/>
    <use href="#sub" xlink:href="#sub" transform="translate(340 82) rotate(14)"/>
    <use href="#chilli" xlink:href="#chilli" transform="translate(140 140) rotate(-20)"/>
    <use href="#bowl" xlink:href="#bowl" transform="translate(62 210) rotate(8)"/>
    <use href="#crispy" xlink:href="#crispy" transform="translate(205 205) rotate(-18)"/>
    <use href="#fries" xlink:href="#fries" transform="translate(345 215) rotate(16)"/>
    <use href="#lemon" xlink:href="#lemon" transform="translate(285 150) rotate(-30)"/>
    <use href="#sub" xlink:href="#sub" transform="translate(85 345) rotate(-22)"/>
    <use href="#burger" xlink:href="#burger" transform="translate(220 340) rotate(10)"/>
    <use href="#drumstick" xlink:href="#drumstick" transform="translate(350 345) rotate(-40)"/>
